[default.extend-words]
chrash = "chrash"
# Home Assistant env vars/secrets (modules/hermes.nix, modules/hoss-sops.nix)
hass = "hass"
# MQTT broker (nuenv/mosquitto.nu)
mosquitto = "mosquitto"
# India Standard Time (nuenv/time.nu)
IST = "IST"
# the Vim command (home/programs/nvim)
enew = "enew"

[files]
# sops-encrypted — base64 ciphertext isn't real words, and the exact false
# positives shift every time a secret is re-encrypted, so exclude rather
# than whitelist individual tokens.
extend-exclude = ["secrets/*.yaml"]
